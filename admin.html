<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欣寧身心診所 — 後台管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
a{text-decoration:none;color:inherit}
/* ── LOGIN ── */
#page-login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%)}
.login-card{background:#1e293b;border-radius:20px;padding:48px 40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid #334155}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-size:1.4rem;color:#fff;letter-spacing:.06em;margin-bottom:6px}
.login-logo p{font-size:.82rem;color:#94a3b8}
.login-logo .badge{display:inline-block;background:#B8850A;color:#fff;font-size:.72rem;padding:3px 10px;border-radius:20px;margin-top:8px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:6px;font-weight:600;letter-spacing:.05em}
.form-group input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:11px 14px;color:#e2e8f0;font-size:.92rem;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:#3b82f6}
.btn-login{width:100%;background:#1B3A6B;border:none;color:#fff;padding:13px;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px;transition:background .2s}
.btn-login:hover{background:#2563eb}
.btn-login:disabled{opacity:.6;cursor:wait}
.login-error{color:#f87171;font-size:.82rem;margin-top:10px;text-align:center;min-height:20px}
/* ── ADMIN LAYOUT ── */
#page-admin{display:flex;min-height:100vh}
.sidebar{width:240px;background:#1e293b;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid #334155}
.sb-logo{padding:24px 20px;border-bottom:1px solid #334155}
.sb-logo h2{font-size:1.05rem;color:#fff;font-weight:700;letter-spacing:.04em}
.sb-logo p{font-size:.72rem;color:#64748b;margin-top:3px}
.sb-logo .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px}
.sb-nav{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:.88rem;color:#94a3b8;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{background:#334155;color:#e2e8f0}
.nav-item.active{background:#1e3a5f;color:#60a5fa;border-left-color:#3b82f6;font-weight:600}
.nav-item .icon{font-size:1rem;width:20px;text-align:center}
.sb-footer{padding:16px 20px;border-top:1px solid #334155;display:flex;flex-direction:column;gap:8px}
.sb-sync{display:flex;align-items:center;gap:7px;font-size:.76rem;color:#4ade80;padding:6px 0;font-weight:600}
.sb-sync .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.sb-link{display:flex;align-items:center;gap:8px;font-size:.8rem;color:#64748b;padding:6px 0;cursor:pointer;transition:color .2s}
.sb-link:hover{color:#e2e8f0}
.btn-logout{background:#7f1d1d;border:none;color:#fca5a5;padding:8px 12px;border-radius:6px;font-size:.8rem;cursor:pointer;transition:background .2s;width:100%;font-family:inherit}
.btn-logout:hover{background:#991b1b}
/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{background:#1e293b;border-bottom:1px solid #334155;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-bar h1{font-size:1.15rem;font-weight:700;color:#fff}
.top-bar .user-info{font-size:.8rem;color:#64748b}
.content-area{flex:1;overflow-y:auto;padding:28px}
/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.toolbar-title{font-size:1rem;color:#94a3b8}
.toolbar-title strong{color:#fff}
.btn-add{background:#1B3A6B;border:none;color:#fff;padding:9px 18px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .2s;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-add:hover{background:#2563eb}
/* ── ITEMS LIST ── */
.items-list{display:flex;flex-direction:column;gap:10px}
.item-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px 18px;transition:border-color .2s}
.item-card:hover{border-color:#3b82f6}
.item-row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.item-order{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.btn-order{background:#0f172a;border:1px solid #334155;color:#94a3b8;width:22px;height:17px;font-size:.6rem;line-height:1;cursor:pointer;transition:all .15s;padding:0;display:flex;align-items:center;justify-content:center}
.btn-order:first-child{border-radius:5px 5px 0 0}
.btn-order:last-child{border-radius:0 0 5px 5px;border-top:none}
.btn-order:hover:not(:disabled){background:#1e3a5f;border-color:#3b82f6;color:#60a5fa}
.btn-order:disabled{opacity:.25;cursor:default}
.item-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.item-status.published{background:#22c55e}
.item-status.draft{background:#64748b}
.item-title{font-size:.93rem;font-weight:600;color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.item-row2{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.item-meta{font-size:.75rem;color:#64748b;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-tag{background:#1e3a5f;color:#60a5fa;padding:2px 7px;border-radius:10px;font-size:.7rem;white-space:nowrap}
.item-actions{display:flex;gap:5px;flex-shrink:0}
.btn-icon{background:none;border:1px solid #334155;color:#94a3b8;padding:6px 12px;border-radius:6px;font-size:.78rem;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-icon:hover{border-color:#60a5fa;color:#60a5fa}
.btn-icon:disabled{opacity:.4;cursor:wait}
.btn-icon.del:hover{border-color:#f87171;color:#f87171}
.btn-icon.toggle.on{border-color:#22c55e;color:#22c55e}
.empty-state{text-align:center;padding:60px 20px;color:#475569}
.empty-state .icon{font-size:3rem;margin-bottom:12px;opacity:.4}
.empty-state p{font-size:.9rem}
/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;backdrop-filter:blur(2px)}
.modal-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;background:#1e293b;border:1px solid #334155;border-radius:16px;width:min(600px,95vw);max-height:90vh;overflow-y:auto;padding:32px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.modal-header h2{font-size:1.15rem;color:#fff}
.btn-close{background:none;border:none;color:#64748b;font-size:1.4rem;cursor:pointer;line-height:1;transition:color .2s}
.btn-close:hover{color:#e2e8f0}
.mform .field{margin-bottom:18px}
.mform label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:6px;font-weight:600;letter-spacing:.04em}
.mform input,.mform textarea,.mform select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 14px;color:#e2e8f0;font-size:.9rem;font-family:inherit;transition:border-color .2s}
.mform textarea{resize:vertical;min-height:120px;line-height:1.6}
.mform input:focus,.mform textarea:focus,.mform select:focus{outline:none;border-color:#3b82f6}
.mform select option{background:#1e293b}
.mform .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mform .check-row{display:flex;align-items:center;gap:10px;padding:10px 0}
.mform .check-row input[type=checkbox]{width:18px;height:18px;accent-color:#3b82f6;cursor:pointer}
.mform .check-row label{font-size:.9rem;color:#e2e8f0;cursor:pointer;margin:0}
.mform .hint{font-size:.72rem;color:#64748b;margin-top:5px;display:block}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid #334155}
.btn-cancel{background:none;border:1px solid #334155;color:#94a3b8;padding:9px 20px;border-radius:8px;font-size:.88rem;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-cancel:hover{border-color:#64748b;color:#e2e8f0}
.btn-save{background:#1B3A6B;border:none;color:#fff;padding:9px 24px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}
.btn-save:hover{background:#2563eb}
.btn-save:disabled{opacity:.6;cursor:wait}
/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px 20px;font-size:.88rem;color:#e2e8f0;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:2000;transform:translateY(120%);transition:transform .3s;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateY(0)}
.toast.success{border-color:#22c55e;color:#86efac}
.toast.error{border-color:#f87171;color:#fca5a5}
/* ── CONFIRM DIALOG ── */
.confirm-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1100;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:28px;width:320px;text-align:center}
.confirm-box h3{color:#fff;margin-bottom:10px}
.confirm-box p{color:#94a3b8;font-size:.88rem;margin-bottom:24px}
.confirm-btns{display:flex;gap:10px;justify-content:center}
.chip-link{display:inline-flex;align-items:center;gap:3px;background:#173252;color:#7db4f5;padding:2px 9px;border-radius:10px;font-size:.72rem;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s}
.chip-link:hover{background:#1e4270;color:#a8ccf8}
.pdf-status{margin-top:8px;display:flex;align-items:center;gap:10px}
.pdf-chip{background:#173252;color:#7db4f5;padding:4px 12px;border-radius:8px;font-size:.78rem}
#pdf-file,#news-img{color:#94a3b8;font-size:.8rem}
#pdf-file::file-selector-button,#news-img::file-selector-button{background:#334155;color:#e2e8f0;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;margin-right:10px;font-family:inherit;font-size:.78rem}
#pdf-file::file-selector-button:hover,#news-img::file-selector-button:hover{background:#3e4f68}
.sched-edit{width:100%;border-collapse:collapse;font-size:.8rem;min-width:760px}
.sched-edit th{background:#1e3a5f;color:#cbd5e1;padding:9px 6px;border:1px solid #334155;font-size:.8rem;letter-spacing:.04em}
.sched-edit td{border:1px solid #334155;padding:8px 9px;vertical-align:top;background:#1e293b}
.sched-edit td.slot-label{background:#0f2347;color:#93c5fd;font-weight:700;text-align:center;vertical-align:middle;white-space:nowrap;font-size:.85rem}
.sched-doc-row{margin-bottom:3px}
.sched-doc{display:flex;align-items:center;gap:7px;padding:3px 2px;cursor:pointer;font-size:.78rem;border-radius:5px;transition:background .15s}
.sched-doc:hover{background:#273449}
.sched-doc input{accent-color:#3b82f6;width:14px;height:14px;cursor:pointer;flex-shrink:0}
.sched-time-row{align-items:center;gap:2px;margin:2px 0 6px 20px}
.sched-time-row select{background:#0f172a;border:1px solid #334155;color:#cbd5e1;font-size:.66rem;border-radius:4px;padding:2px 1px;font-family:inherit;width:38px}
.sched-time-row .tilde{color:#64748b;font-size:.68rem;margin:0 1px}
.sched-off{margin-top:5px;font-size:.68rem;color:#64748b;text-align:center;background:#0f172a;border-radius:6px;padding:2px 0;letter-spacing:.2em}
.sched-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.loading-row{text-align:center;padding:60px 20px;color:#475569;font-size:.9rem}
</style>
</head>
<body>

<!-- ── LOGIN PAGE ── -->
<div id="page-login">
  <div class="login-card">
    <div class="login-logo">
      <h1>欣寧身心診所</h1>

      <span class="badge">後台管理系統</span>

</div>

<!-- ── ADMIN PAGE ── -->
<div id="page-admin" style="display:none">
  <aside class="sidebar">
    <div class="sb-logo">
      <h2>欣寧身心診所</h2>
      <p>後台管理系統</p>
    </div>
    <nav class="sb-nav">
      <div class="nav-item active" data-tab="news" onclick="switchTab('news',this)">

  <div class="main">

      <h1 id="top-title">最新消息管理</h1>
      <span class="user-info" id="user-info"></span>
    </div>
    <div class="content-area">
      <div class="toolbar">
        <div class="toolbar-title"><strong id="count-label">0</strong> 則內容</div>
        <button class="btn-add" onclick="openAdd()">＋ 新增</button>

      </div>

</div>

<!-- ── MODAL ── -->
<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="closeModal()"></div>
<div id="modal-box" class="modal-box" style="display:none">
  <div class="modal-header">
    <h2 id="modal-title">新增最新消息</h2>
    <button class="btn-close" onclick="closeModal()">✕</button>
  </div>
  <form class="mform" id="modal-form" onsubmit="saveItem(event)">

      <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
      <button type="submit" class="btn-save" id="save-btn">儲存發布</button>

</div>

<!-- ── CONFIRM ── -->
<div id="confirm-overlay" class="modal-overlay" style="display:none"></div>
<div id="confirm-box" class="confirm-box" style="display:none">
  <h3>確認刪除</h3>
  <p id="confirm-msg">確定要刪除這筆內容嗎？此操作無法復原。</p>
  <div class="confirm-btns">
    <button class="btn-cancel" onclick="closeConfirm()">取消</button>
    <button class="btn-save" style="background:#7f1d1d" id="confirm-ok">確定刪除</button>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
// ── FIREBASE INIT ──
const firebaseConfig = {
  apiKey: "AIzaSyCQkcQeqx-AMRSzS_ED109l_-sQvSKaDYM",
  authDomain: "nazareth-clinic.firebaseapp.com",
  projectId: "nazareth-clinic",
  storageBucket: "nazareth-clinic.firebasestorage.app",
  messagingSenderId: "515116527407",
  appId: "1:515116527407:web:5bb8ab6bd6a22bdf2cbbda"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ── 上傳大小限制（Firestore 單一文件上限 1MiB，base64 會膨脹約 1.37 倍）──
const IMG_MAX_BYTES = 550 * 1024;   // 壓縮後圖片原始位元組上限
const PDF_MAX_BYTES = 650 * 1024;   // PDF 檔案原始位元組上限

// ── 即時快取（由 Firestore onSnapshot 同步）──
const cache = { news: [], articles: [], videos: [] };
let scheduleCache = null;
let listenersStarted = false;
const unsub = [];

const DEFAULT_SCHEDULE = {
  am:  { mon:[], tue:['chen'], wed:[], thu:['lin'], fri:[], sat:['lin'] },
  pm:  { mon:['lin'], tue:['chen'], wed:['li'], thu:['lin'], fri:['lin'], sat:[] },
  eve: { mon:['lin'], tue:[], wed:['li'], thu:[], fri:['lin'], sat:[] }
};

function getSchedule(){ return scheduleCache || JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)); }

function startListeners(){
  if(listenersStarted) return;
  listenersStarted = true;
  ['news','articles','videos'].forEach(col => {
    const u = db.collection(col).orderBy('order').onSnapshot(snap => {
      cache[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if(curTab === col) renderList();
    }, err => { toast('讀取' + col + '失敗：' + err.message, 'error'); });
    unsub.push(u);
  });
  const us = db.collection('schedule').doc('current').onSnapshot(snap => {
    scheduleCache = snap.exists ? snap.data() : null;
    if(curTab === 'schedule') renderList();
  }, err => { toast('讀取門診表失敗：' + err.message, 'error'); });
  unsub.push(us);
}
function stopListeners(){
  unsub.forEach(u => u());
  unsub.length = 0;
  listenersStarted = false;
  cache.news = []; cache.articles = []; cache.videos = []; scheduleCache = null;
}

// ── 最新消息圖片（壓縮後仍以 base64 存進文件內）──
let pendingImg = null;

function handleNewsImg(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      compressToLimit(im, IMG_MAX_BYTES, (dataUrl, ok) => {
        if(!ok){ toast('圖片過於複雜，即使壓縮也超過大小上限，請換一張較簡單的圖片', 'error'); return; }
        pendingImg = { data: dataUrl };
        renderImgStatus();
      });
    };
    im.onerror = () => toast('圖片讀取失敗', 'error');
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}

function compressToLimit(im, maxBytes, cb){
  let w = im.width, h = im.height, quality = 0.82;
  const MAXW = 1200;
  if(w > MAXW){ h = Math.round(h * MAXW / w); w = MAXW; }
  let attempts = 0;
  function tryOnce(){
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);
    const dataUrl = c.toDataURL('image/jpeg', quality);
    const bytes = Math.ceil(dataUrl.length * 0.75);
    attempts++;
    if(bytes <= maxBytes || attempts >= 6){
      cb(dataUrl, bytes <= maxBytes);
      return;
    }
    if(quality > 0.4){ quality -= 0.15; }
    else { w = Math.round(w * 0.8); h = Math.round(h * 0.8); quality = 0.7; }
    tryOnce();
  }
  tryOnce();
}

function removeNewsImg(){
  pendingImg = null;
  const fi = document.getElementById('news-img');
  if(fi) fi.value = '';
  renderImgStatus();
}

function renderImgStatus(){
  const box = document.getElementById('img-status');
  if(!box) return;
  box.innerHTML = (pendingImg && pendingImg.data)
    ? '<img src="' + pendingImg.data + '" style="max-height:80px;border-radius:8px;border:1px solid #334155"><button type="button" class="btn-icon del" style="padding:3px 10px;font-size:.72rem" onclick="removeNewsImg()">移除</button>'
    : '<span style="color:#64748b;font-size:.76rem">尚未選擇圖片</span>';
}

// ── PDF 附件 ──
let pendingPdf = null;

function handlePdf(input){
  const f = input.files && input.files[0];
  if(!f) return;
  if(f.size > PDF_MAX_BYTES){
    toast('PDF 檔案過大（上限約 ' + Math.round(PDF_MAX_BYTES/1024) + 'KB，資料庫單筆容量限制）', 'error');
    input.value = '';
    return;
  }
  const rd = new FileReader();
  rd.onload = () => {
    pendingPdf = { name: f.name, data: rd.result };
    renderPdfStatus();
  };
  rd.readAsDataURL(f);
}

function removePdf(){
  pendingPdf = null;
  const fi = document.getElementById('pdf-file');
  if(fi) fi.value = '';
  renderPdfStatus();
}

function renderPdfStatus(){
  const box = document.getElementById('pdf-status');
  if(!box) return;
  box.innerHTML = pendingPdf
    ? `<span class="pdf-chip">📄 ${esc(pendingPdf.name)}</span><button type="button" class="btn-icon del" style="padding:3px 10px;font-size:.72rem" onclick="removePdf()">移除</button>`
    : '<span style="color:#64748b;font-size:.76rem">尚未選擇檔案</span>';
}

function pdfBlobUrl(dataUrl){
  const b64 = dataUrl.split(',')[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], {type:'application/pdf'}));
}

function openPdf(id){
  const item = cache[curTab].find(i=>i.id===id);
  if(item && item.pdf && item.pdf.data) window.open(pdfBlobUrl(item.pdf.data), '_blank');
}

// ── TAB STATE ──
let curTab = 'news';
let editId = null;

// ── 門診表 ──
const SCHED_DOCTORS = [
  { id:'lin',    name:'林立寧', color:'#7db4f5' },
  { id:'chenyi', name:'陳毅',   color:'#6ee7a0' },
  { id:'li',     name:'李晨曦', color:'#c9a2f7' },
  { id:'chen',   name:'李宸',   color:'#f5d06b' }
];
const SCHED_DAYS  = [['mon','MON 一'],['tue','TUE 二'],['wed','WED 三'],['thu','THU 四'],['fri','FRI 五'],['sat','SAT 六']];
const SCHED_SLOTS = [['am','09~12'],['pm','14~17'],['eve','18~21']];

// entry 可能是舊格式的純字串 'lin'（無時間），或新格式 {id:'lin', time:'13:30-16:30'}
function schedFindEntry(picked, docId){
  for(const p of picked){
    if(typeof p === 'string'){ if(p === docId) return { id: docId, time: null }; }
    else if(p && p.id === docId){ return { id: docId, time: p.time || null }; }
  }
  return null;
}
function schedHourOpts(min, max, sel){
  let h = '<option value="">--</option>';
  for(let x=min; x<=max; x++){
    const v = String(x).padStart(2,'0');
    h += '<option value="' + v + '"' + (sel===v?' selected':'') + '>' + v + '</option>';
  }
  return h;
}
function schedMinOpts(sel){
  return '<option value="">--</option>'
       + '<option value="00"' + (sel==='00'?' selected':'') + '>00</option>'
       + '<option value="30"' + (sel==='30'?' selected':'') + '>30</option>';
}

function renderScheduleEditor(){
  const list = document.getElementById('items-list');
  const cur = getSchedule();
  let html = '<p style="color:#94a3b8;font-size:.85rem;margin-bottom:14px">勾選每個時段的看診醫師；全部不勾即為 <b style="color:#e2e8f0">休診</b>。勾選後可選填實際看診時間（選填，前台會顯示在姓名下方；預設不選就不顯示）。變更會即時同步到前台，不需另外發布。</p>';
  html += '<div style="overflow-x:auto"><table class="sched-edit"><thead><tr><th style="width:70px">時段</th>';
  SCHED_DAYS.forEach(d => { html += '<th>' + d[1] + '</th>'; });
  html += '</tr></thead><tbody>';
  SCHED_SLOTS.forEach(sl => {
    const sk = sl[0];
    html += '<tr><td class="slot-label">' + sl[1] + '</td>';
    SCHED_DAYS.forEach(dy => {
      const dk = dy[0];
      const picked = (cur[sk] && cur[sk][dk]) || [];
      html += '<td data-cell="' + sk + '_' + dk + '">';
      SCHED_DOCTORS.forEach(doc => {
        const entry = schedFindEntry(picked, doc.id);
        const chk = entry ? ' checked' : '';
        let sh='', sm='', eh='', em='';
        if(entry && entry.time){
          const parts = entry.time.split('-');
          if(parts[0]){ const p0 = parts[0].split(':'); sh = p0[0]||''; sm = p0[1]||''; }
          if(parts[1]){ const p1 = parts[1].split(':'); eh = p1[0]||''; em = p1[1]||''; }
        }
        html += '<div class="sched-doc-row">';
        html += '<label class="sched-doc"><input type="checkbox" data-slot="' + sk + '" data-day="' + dk + '" value="' + doc.id + '"' + chk + ' onchange="schedCellChanged(this)"><span style="color:' + doc.color + '">' + doc.name + '</span></label>';
        html += '<div class="sched-time-row" data-doc="' + doc.id + '" style="display:' + (entry?'flex':'none') + '">'
              + '<select class="st-sh">' + schedHourOpts(8,18,sh) + '</select>'
              + '<select class="st-sm">' + schedMinOpts(sm) + '</select>'
              + '<span class="tilde">~</span>'
              + '<select class="st-eh">' + schedHourOpts(12,21,eh) + '</select>'
              + '<select class="st-em">' + schedMinOpts(em) + '</select>'
              + '</div>';
        html += '</div>';
      });
      html += '<div class="sched-off"' + (picked.length ? ' style="display:none"' : '') + '>休診</div>';
      html += '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="sched-actions">'
        + '<button class="btn-cancel" onclick="resetSchedule()">還原預設班表</button>'
        + '<button class="btn-save" onclick="saveSchedule()">💾 儲存門診表</button>'
        + '</div>';
  list.innerHTML = html;
}

function schedCellChanged(cb){
  const td = cb.closest('td');
  const any = td.querySelectorAll('input:checked').length > 0;
  const off = td.querySelector('.sched-off');
  if(off) off.style.display = any ? 'none' : 'block';
  const row = td.querySelector('.sched-time-row[data-doc="' + cb.value + '"]');
  if(row){
    row.style.display = cb.checked ? 'flex' : 'none';
    if(!cb.checked){
      row.querySelectorAll('select').forEach(s => { s.value = ''; });
    }
  }
}

async function saveSchedule(){
  const obj = { am:{}, pm:{}, eve:{} };
  SCHED_SLOTS.forEach(sl => SCHED_DAYS.forEach(dy => { obj[sl[0]][dy[0]] = []; }));
  document.querySelectorAll('.sched-edit input[type=checkbox]:checked').forEach(cb => {
    const td = cb.closest('td');
    const row = td.querySelector('.sched-time-row[data-doc="' + cb.value + '"]');
    let entry = cb.value;
    if(row){
      const sh = row.querySelector('.st-sh').value;
      const sm = row.querySelector('.st-sm').value;
      const eh = row.querySelector('.st-eh').value;
      const em = row.querySelector('.st-em').value;
      if(sh && sm !== '' && eh && em !== ''){
        entry = { id: cb.value, time: sh + ':' + sm + '-' + eh + ':' + em };
      }
    }
    obj[cb.dataset.slot][cb.dataset.day].push(entry);
  });
  try {
    await db.collection('schedule').doc('current').set(obj);
    toast('門診表已儲存並同步到前台', 'success');
  } catch(err){
    toast('儲存失敗：' + err.message, 'error');
  }
}

async function resetSchedule(){
  try {
    await db.collection('schedule').doc('current').set(JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)));
    toast('已還原為預設班表', 'success');
  } catch(err){
    toast('還原失敗：' + err.message, 'error');
  }
}

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById('user-info').textContent = '登入：' + user.email;
    showAdmin();
    startListeners();
  } else {
    stopListeners();
    showLogin();
  }
});

function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('inp-email').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const err = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  err.textContent = '';
  if(!email || !pass){ err.textContent = '請輸入 Email 和密碼。'; return; }
  btn.disabled = true; btn.textContent = '登入中…';
  auth.signInWithEmailAndPassword(email, pass)
    .catch(e2 => {
      err.textContent = (e2.code === 'auth/invalid-credential' || e2.code === 'auth/wrong-password' || e2.code === 'auth/user-not-found')
        ? '帳號或密碼錯誤，請重試。' : '登入失敗：' + e2.message;
    })
    .finally(() => { btn.disabled = false; btn.textContent = '登入'; });
}

function doLogout(){
  auth.signOut();
}

  document.getElementById('page-login').style.display='flex';
  document.getElementById('page-admin').style.display='none';
}

function showAdmin(){
  document.getElementById('page-login').style.display='none';
  document.getElementById('page-admin').style.display='flex';

// ── TAB SWITCH ──
function switchTab(tab, el){
  curTab = tab;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const meta = TAB_META[tab];
  document.getElementById('top-title').textContent = meta.label + '管理';
  renderList();
}

// ── RENDER ──
function renderList(){
  const toolbar = document.querySelector('.toolbar');
  if(curTab === 'schedule'){
    if(toolbar) toolbar.style.display = 'none';
    renderScheduleEditor();
    return;
  }
  if(toolbar) toolbar.style.display = 'flex';
  const items = cache[curTab] || [];
  const meta = TAB_META[curTab];
  const count = document.getElementById('count-label');
  const list  = document.getElementById('items-list');
  count.textContent = items.length;

  if(!items.length){
    list.innerHTML = `<div class="empty-state"><div class="icon">${meta.icon}</div><p>${meta.emptyTxt}，點擊「新增」開始發布。</p></div>`;
    return;
  }

  list.innerHTML = items.map((item,idx) => renderCard(item, idx, items.length)).join('');
}

function renderCard(item, idx, total){
  const pub = item.published;
  let meta2 = `<span>${formatDate(item.date)}</span>`;
  if(curTab==='news' && item.img && item.img.data) meta2 += `<span class="item-tag">🖼️ 含圖片</span>`;
  if(curTab==='articles' && item.category) meta2 += `<span class="item-tag">${item.category}</span>`;
  if(curTab==='articles' && item.author)   meta2 += `<span>${item.author}</span>`;
  if(curTab==='articles' && item.url)      meta2 += `<a class="chip-link" href="${esc(item.url)}" target="_blank" rel="noopener">🔗 開啟網址</a>`;
  if(curTab==='articles' && item.pdf && item.pdf.data) meta2 += `<span class="chip-link" onclick="openPdf('${item.id}')">📄 開啟 PDF</span>`;
  if(curTab==='videos' && item.url)        meta2 += `<span style="color:#3b82f6">${truncate(item.url,40)}</span>`;

  const upDisabled = idx === 0 ? ' disabled' : '';
  const downDisabled = idx === total - 1 ? ' disabled' : '';
  return `<div class="item-card">
    <div class="item-row1">
      <div class="item-order">
        <button class="btn-order" onclick="moveItem('${item.id}',-1)"${upDisabled} title="上移">▲</button>
        <button class="btn-order" onclick="moveItem('${item.id}',1)"${downDisabled} title="下移">▼</button>
      </div>
      <div class="item-status ${pub?'published':'draft'}"></div>
      <div class="item-title">${esc(item.title||'（無標題）')}</div>
    </div>
    <div class="item-row2">
      <div class="item-meta">${meta2}<span style="color:${pub?'#22c55e':'#64748b'}">${pub?'已發布':'草稿'}</span></div>
      <div class="item-actions">
        <button class="btn-icon toggle ${pub?'on':''}" onclick="togglePublish('${item.id}')">${pub?'取消發布':'發布'}</button>
        <button class="btn-icon" onclick="openEdit('${item.id}')">編輯</button>
        <button class="btn-icon del" onclick="confirmDelete('${item.id}')">刪除</button>
      </div>
    </div>
  </div>`;
}

    <div class="field"><label>文章網址（選填）</label><input name="url" placeholder="https://…　前台會顯示「閱讀全文」連結"></div>
    <div class="field"><label>PDF 檔案（選填）</label>
      <input type="file" id="pdf-file" accept="application/pdf" onchange="handlePdf(this)">
      <span class="hint">上限約 ${Math.round(PDF_MAX_BYTES/1024)}KB（資料庫單筆容量限制）</span>
      <div id="pdf-status" class="pdf-status"></div>

    <div class="field"><label>說明文字</label><textarea name="content" placeholder="影片說明（選填）"></textarea></div>
    <div class="field"><label>發布日期</label><input type="date" name="date" style="max-width:200px"></div>

function openAdd(){
  editId = null;
  pendingPdf = null;
  pendingImg = null;
  const meta = TAB_META[curTab];
  document.getElementById('modal-title').textContent = '新增' + meta.label;
  document.getElementById('modal-fields').innerHTML = getFields();
  const dateInp = document.querySelector('#modal-fields input[name=date]');
  if(dateInp) dateInp.value = todayStr();
  renderPdfStatus();
  renderImgStatus();
  showModal();
}

function openEdit(id){
  const items = cache[curTab];
  const item = items.find(i=>i.id===id);
  if(!item) return;
  editId = id;
  const meta = TAB_META[curTab];
  document.getElementById('modal-title').textContent = '編輯' + meta.label;
  document.getElementById('modal-fields').innerHTML = getFields();
  const form = document.getElementById('modal-form');
  Object.keys(item).forEach(k=>{
    const el = form.querySelector(`[name="${k}"]`);
    if(!el) return;
    if(el.type==='checkbox') el.checked = !!item[k];
    else el.value = item[k] || '';
  });
  pendingPdf = (item.pdf && item.pdf.data) ? item.pdf : null;
  pendingImg = (item.img && item.img.data) ? item.img : null;
  renderPdfStatus();
  renderImgStatus();
  showModal();
}

async function saveItem(e){
  e.preventDefault();
  const form = document.getElementById('modal-form');
  const data = {};
  form.querySelectorAll('[name]').forEach(el=>{
    if(el.type==='checkbox') data[el.name] = el.checked;
    else data[el.name] = el.value.trim();
  });
  if(curTab === 'articles') data.pdf = pendingPdf || null;
  if(curTab === 'news') data.img = pendingImg || null;
  if(!data.date) data.date = todayStr();

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    if(editId){
      await db.collection(curTab).doc(editId).set(data, { merge: true });
    } else {
      const items = cache[curTab];
      const minOrder = items.length ? Math.min(...items.map(i => i.order ?? 0)) : 0;
      data.order = minOrder - 1;
      const newId = 'id_' + Date.now();
      await db.collection(curTab).doc(newId).set(data);
    }
    closeModal();
    toast(editId ? '已更新內容' : '已新增並發布', 'success');
  } catch(err){
    toast('儲存失敗：' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '儲存發布';
  }
}

function showModal(){
  document.getElementById('modal-overlay').style.display='block';
  document.getElementById('modal-box').style.display='block';
}
function closeModal(){
  document.getElementById('modal-overlay').style.display='none';
  document.getElementById('modal-box').style.display='none';
  editId = null;
}

// ── REORDER / TOGGLE / DELETE ──
async function moveItem(id, dir){
  const items = cache[curTab];
  const i = items.findIndex(x=>x.id===id);
  if(i < 0) return;
  const j = i + dir;
  if(j < 0 || j >= items.length) return;
  const a = items[i], b = items[j];
  try {
    const batch = db.batch();
    batch.update(db.collection(curTab).doc(a.id), { order: b.order ?? 0 });
    batch.update(db.collection(curTab).doc(b.id), { order: a.order ?? 0 });
    await batch.commit();
  } catch(err){
    toast('排序失敗：' + err.message, 'error');
  }
}

async function togglePublish(id){
  const item = cache[curTab].find(i=>i.id===id);
  if(!item) return;
  try {
    await db.collection(curTab).doc(id).update({ published: !item.published });
    toast(!item.published ? '已發布到前台' : '已取消發布', !item.published?'success':'');
  } catch(err){
    toast('操作失敗：' + err.message, 'error');
  }
}

let deleteTarget = null;
function confirmDelete(id){
  deleteTarget = id;
  document.getElementById('confirm-overlay').style.display='block';
  document.getElementById('confirm-box').style.display='block';
  document.getElementById('confirm-ok').onclick = executeDelete;
}
function closeConfirm(){
  deleteTarget = null;
  document.getElementById('confirm-overlay').style.display='none';
  document.getElementById('confirm-box').style.display='none';
}
async function executeDelete(){
  if(!deleteTarget) return;
  try {
    await db.collection(curTab).doc(deleteTarget).delete();
    closeConfirm();
    toast('已刪除', 'error');
  } catch(err){
    toast('刪除失敗：' + err.message, 'error');
  }
}

// ── TOAST ──
function toast(msg, type=''){
  const el = document.getElementById('toast');
  el.textContent = (type==='success'?'✓ ':type==='error'?'✕ ':'') + msg;
  el.className = 'toast show ' + type;
  setTimeout(()=> el.classList.remove('show'), 2800);
}

// ── UTILS ──
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function truncate(s,n){ return s.length>n ? s.slice(0,n)+'…' : s }
function todayStr(){ return new Date().toISOString().slice(0,10) }
function formatDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${y}年${m}月${day}日`;
}
